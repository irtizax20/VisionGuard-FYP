<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Guard Parent Approval</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: #2B383D;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        h1 {
            color: #2B383D;
            margin-bottom: 10px;
        }
        .loading {
            color: #666;
            margin: 20px 0;
        }
        .success {
            color: #4CAF50;
            font-weight: bold;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2B383D;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">👁️</div>
        <h1>Vision Guard Parent Approval</h1>
        <div id="status" class="loading">Verifying your approval...</div>
        <div class="spinner" id="spinner"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getAuth, isSignInWithEmailLink, signInWithEmailLink, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

        // Firebase config using your provided credentials
        const firebaseConfig = {
            apiKey: "AIzaSyAjMg01e7LUVPjFeM3W-1GUQOPe3nPzKhU",
            authDomain: "blinkfit-ca40a.firebaseapp.com",
            projectId: "blinkfit-ca40a",
            storageBucket: "blinkfit-ca40a.firebasestorage.app",
            messagingSenderId: "969589250918",
            appId: "1:969589250918:web:a30af2f85f57e5ae0906a7",
            measurementId: "G-F20JQMHZ2H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const statusEl = document.getElementById('status');
        const spinnerEl = document.getElementById('spinner');

        async function processApproval() {
            try {
                // Get parameters from URL
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                const email = urlParams.get('email');

                if (!token) {
                    throw new Error('Missing approval token');
                }

                if (!email) {
                    throw new Error('Missing parent email');
                }

                // Verify this is a valid email link
                if (!isSignInWithEmailLink(auth, window.location.href)) {
                    throw new Error('Invalid approval link');
                }

                statusEl.textContent = 'Verifying your identity...';

                // Sign in with the email link
                const userCredential = await signInWithEmailLink(auth, email, window.location.href);
                const user = userCredential.user;

                // SECURITY CHECK: Verify signed-in email matches expected parent email
                if (user.email !== email) {
                    throw new Error('Email mismatch - wrong person trying to approve');
                }

                statusEl.textContent = 'Checking approval request...';

                // Get verification document to check expiration
                const verificationDoc = await getDoc(doc(db, 'parent_verifications', token));
                
                if (!verificationDoc.exists()) {
                    throw new Error('Approval request not found');
                }

                const verificationData = verificationDoc.data();

                // Check if already processed
                if (verificationData.status !== 'pending') {
                    throw new Error(`This request has already been ${verificationData.status}`);
                }

                // Check expiration (24 hours)
                const expiresAt = verificationData.expiresAt?.toDate();
                if (expiresAt && new Date() > expiresAt) {
                    // Mark as expired
                    await updateDoc(doc(db, 'parent_verifications', token), {
                        status: 'expired',
                        expiredAt: serverTimestamp()
                    });
                    throw new Error('This approval link has expired. Please ask your child to request a new verification.');
                }

                statusEl.textContent = 'Approving your child\'s signup...';

                // Update the approval status in Firestore
                await updateDoc(doc(db, 'parent_verifications', token), {
                    status: 'verified',
                    verifiedAt: serverTimestamp(),
                    verifiedBy: user.uid
                });

                // Success
                spinnerEl.style.display = 'none';
                statusEl.innerHTML = `
                    <div class="success">
                        ✅ Verification Successful!
                        <br><br>
                        Your child can now continue with their Vision Guard signup.
                        <br><br>
                        You can safely close this page.
                    </div>
                `;

                // Optional: Sign out the parent after approval
                setTimeout(() => signOut(auth), 2000);

            } catch (error) {
                console.error('Approval error:', error);
                spinnerEl.style.display = 'none';
                statusEl.innerHTML = `
                    <div class="error">
                        ❌ Approval Failed
                        <br><br>
                        ${error.message || 'An unknown error occurred'}
                        <br><br>
                        Please contact support if this continues.
                    </div>
                `;
            }
        }

        // Start the approval process
        processApproval();
    </script>
</body>
</html>
